[workspace]
members = [
    "app",
    "crates/contracts",
    "crates/services",
]
resolver = "2"

[workspace.package]
version = "0.4.5"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["fullstack", "launch", "lib", "logger"] }
dioxus-router = { version = "=0.7.10", default-features = false, features = ["html"] }
futures-util = "=0.3.34"
md-web-contracts = { path = "crates/contracts" }
md-web-services = { path = "crates/services" }
nix = { version = "=0.30.1", features = ["process", "signal"] }
portable-pty = "=0.9.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "signal", "time"] }
uuid = { version = "=1.25.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_mut = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_copy = "deny"
redundant_clone = "warn"
needless_lifetimes = "warn"
