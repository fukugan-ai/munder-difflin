[workspace]
members = [
    "app",
    "crates/contracts",
    "crates/services",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["fullstack", "launch", "lib", "logger"] }
md-web-contracts = { path = "crates/contracts" }
md-web-services = { path = "crates/services" }
serde = { version = "=1.0.229", features = ["derive"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_mut = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_copy = "deny"
redundant_clone = "warn"
needless_lifetimes = "warn"
